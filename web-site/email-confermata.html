<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0907" />

    <title>KlokShift · Email confermata</title>
    <meta name="description" content="Hai confermato l'email del tuo account KlokShift. Torna nell'app per entrare." />

    <!-- Ci si arriva solo dal link di conferma: niente indice, niente sitemap. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- L'URL porta nel fragment i token della sessione appena confermata: non
         deve finire nel Referer di nessun link in uscita. -->
    <meta name="referrer" content="no-referrer" />

    <link rel="icon" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/email-confermata.tsx"></script>
  </body>
