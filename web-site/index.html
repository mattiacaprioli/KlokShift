    <script>
      // Compatibilità con i QR di recensione già stampati: il loro URL è la
      // radice con `?w=<id>`, che ora è la vetrina. Finché `web-review/` resta
      // pubblicato sotto /recensioni/, si rimanda lì prima di caricare il
      // bundle. Quando le recensioni verranno rimosse, sparisce anche questo.
      (function () {
        var q = window.location.search;
        if (q.length > 1 && /(^|[?&])w=/.test(q)) {
          window.location.replace("recensioni/" + q);
        }
      })();
    </script>
