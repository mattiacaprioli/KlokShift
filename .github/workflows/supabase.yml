name: Deploy Supabase migrations

# Solo workflow riusabile: `ci.yml` lo chiama dopo gate client, DB ed Edge.
on:
  workflow_call:
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_DB_PASSWORD:
        required: true

jobs:
  db-push:
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          # Stessa versione dichiarata nel package del progetto: niente latest.
          version: 2.108.0

      - name: Link project
        run: supabase link --project-ref rmlobxjlqlpixkvrzmfg

      - name: Push migrations
        run: supabase db push
