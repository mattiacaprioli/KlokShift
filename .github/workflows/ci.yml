name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      # La dashboard web ha un tsconfig separato (lib DOM, alias verso il client
      # Supabase web). La root la esclude, quindi va controllata a parte.
      - name: Typecheck dashboard web
        run: npx tsc -p web --noEmit

      # Stessa storia per il sito vetrina: tsconfig proprio, escluso dalla root.
      - name: Typecheck sito vetrina
        run: npx tsc -p web-site --noEmit

      # Blocking: ESLint is configured (eslint.config.js + eslint-config-expo).
      # Fails on errors; advisory warnings (e.g. RHF watch) don't block.
      # `expo lint` senza argomenti guarda solo src/app/components: dashboard e
      # vetrina vanno nominate, altrimenti questo job dà falsa sicurezza su
      # web/src e web-site/src.
      - name: Lint
        run: npx expo lint src web/src web-site/src
