name: CI e rilascio

on:
  push:
    branches: [main]
  pull_request:
  # Rilascio manuale di tutto (dashboard, sito e migration). Serve perché la
  # dashboard si pubblica solo se l'ultimo push tocca i suoi file (`changes`).
  workflow_dispatch:

# Un run alla volta per ref, in ordine: due push ravvicinati non pubblicano più
# l'artifact vecchio sopra il nuovo. `false` è voluto: un `db push` non va mai
# interrotto a metà. GitHub tiene in coda solo l'ultimo run in attesa (come già
# fanno i gruppi dei deploy): se un push intermedio salta, i suoi file non
# entrano nel filtro del successivo. Per questo le migration non passano dal
# filtro (vedi `deploy-database`); per la dashboard il rimedio resta
# `workflow_dispatch`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.filter.outputs.pages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Il deploy della dashboard resta selettivo; i gate sotto girano su ogni
      # PR e push.
      # Sul primo push del branch GitHub usa uno SHA `before` tutto zero: in
      # quel caso l'albero corrente è l'unica base affidabile.
      - id: filter
        name: Individua superfici da pubblicare
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          pages=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pages=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}"; then
              mapfile -t files < <(git ls-tree -r --name-only "$GITHUB_SHA")
            else
              mapfile -t files < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
            fi

            for file in "${files[@]}"; do
              case "$file" in
                web-site/*|web/*|src/*|shared/*|package.json|yarn.lock|.github/workflows/ci.yml|.github/workflows/deploy-web.yml)
                  pages=true
                  ;;
              esac
            done
          fi

          echo "pages=$pages" >> "$GITHUB_OUTPUT"

  client:
    runs-on: ubuntu-latest
    env:
      # Vite scrive URL e key Supabase dentro il bundle al momento della build:
      # l'artifact pubblicato deve nascere qui con quelli reali. Su PR e branch
      # restano fittizi (li sceglie scripts/release-config.mjs), e i valori reali
      # non arrivano nemmeno al job.
      KS_RELEASE: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
      RELEASE_SUPABASE_URL: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.EXPO_PUBLIC_SUPABASE_URL || '' }}
      RELEASE_SUPABASE_ANON_KEY: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || '' }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL || 'https://klokshift.com' }}
      EXPO_PUBLIC_APP_URL: ${{ vars.EXPO_PUBLIC_APP_URL || './app' }}
      EXPO_PUBLIC_IOS_URL: ${{ vars.EXPO_PUBLIC_IOS_URL }}
      EXPO_PUBLIC_ANDROID_URL: ${{ vars.EXPO_PUBLIC_ANDROID_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: yarn

      - name: Installa dipendenze
        run: yarn install --frozen-lockfile

      # Nel rilascio fallisce se le variabili mancano o sono i placeholder:
      # così deploy-pages, che dipende da questo job, non parte.
      - name: Seleziona configurazione Supabase
        run: node scripts/release-config.mjs select

      - name: Test client
        run: yarn test:unit

      - name: Typecheck app
        run: yarn typecheck

      - name: Typecheck dashboard web
        run: yarn web:typecheck

      - name: Typecheck sito vetrina
        run: yarn site:typecheck

      - name: Lint
        run: yarn lint

      - name: Build dashboard
        run: yarn web:build

      - name: Verifica bundle dashboard
        if: env.KS_RELEASE == 'true'
        run: node scripts/release-config.mjs check-bundle web/dist

      - name: Build sito vetrina
        run: yarn site:build

      - name: Verifica bundle iOS
        run: CI=1 EXPO_OFFLINE=1 yarn expo export --platform ios --output-dir /tmp/klokshift-ci-ios

      # Si pubblica esattamente l'artifact costruito dal job che ha superato i
      # gate, senza ricompilarlo in un workflow indipendente.
      - name: Assembla artifact Pages
        if: env.KS_RELEASE == 'true'
        run: |
          mkdir -p _site/app
          cp -r web-site/dist/. _site/
          cp -r web/dist/. _site/app/

      - uses: actions/upload-pages-artifact@v3
        if: env.KS_RELEASE == 'true'
        with:
          path: _site

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Avvia Postgres di test
        timeout-minutes: 5
        run: supabase/tests/run.sh up

      - name: Replay completo delle migration
        run: supabase/tests/run.sh reset

      - name: Test SQL e RLS
        run: supabase/tests/run.sh test

      - name: Ferma Postgres di test
        if: always()
        run: supabase/tests/run.sh down

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
          cache: true

      - name: Verifica lock e tipi Edge Functions
        working-directory: supabase/functions
        run: deno task check

  # Dopo le migration: una dashboard che legge colonne o tabelle nuove non deve
  # andare online prima che il database le abbia (400 su ogni lettura, il
  # 16/10 con la pausa). Se il `db push` fallisce, la dashboard resta quella di
  # prima.
  deploy-pages:
    needs: [changes, client, database, edge, deploy-database]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.changes.outputs.pages == 'true'
    uses: ./.github/workflows/deploy-web.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # A ogni rilascio, senza filtro: `supabase db push` applica solo le migration
  # che il remoto non ha, e senza niente da applicare non tocca nulla. Con il
  # filtro, una migration arrivata in un push il cui run è stato scavalcato in
  # coda non usciva mai (successo con i commit C e con la pausa).
  deploy-database:
    needs: [client, database, edge]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/supabase.yml
    # Solo i due segreti dichiarati da supabase.yml, non tutti quelli del repo.
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
